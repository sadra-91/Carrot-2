name: Build Carrot

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 requests keyboard openai Pillow pycairo svgwrite pyinstaller

      - name: Prepare release folder
        shell: pwsh
        run: |
          if (Test-Path "release") {
            Remove-Item "release" -Recurse -Force
          }

          New-Item -ItemType Directory -Path "release" | Out-Null

      - name: Build PF-Carrot
        working-directory: "app"
        shell: pwsh
        run: |
          if (Test-Path "build") {
            Remove-Item "build" -Recurse -Force
          }

          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name PF-Carrot `
            --distpath "..\release" `
            --workpath "build" `
            main.py

          Get-ChildItem -File | Where-Object {
            $_.Name -notin @(
              "main.py",
              "PF-Carrot.spec"
            )
          } | ForEach-Object {
            Copy-Item $_.FullName "..\release\$($_.Name)" -Force
          }

          Get-ChildItem -Directory | Where-Object {
            $_.Name -notin @(
              "build",
              "__pycache__"
            )
          } | ForEach-Object {
            Get-ChildItem $_.FullName -File -Recurse | ForEach-Object {
              Copy-Item $_.FullName "..\release\$($_.Name)" -Force
            }
          }

      - name: Build C-Assistant
        working-directory: "assistant d"
        shell: pwsh
        run: |
          if (Test-Path "build") {
            Remove-Item "build" -Recurse -Force
          }

          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name C-Assistant `
            --distpath "..\release" `
            --workpath "build" `
            assistant.py

          Get-ChildItem -File | Where-Object {
            $_.Name -notin @(
              "assistant.py",
              "C-Assistant.spec"
            )
          } | ForEach-Object {
            Copy-Item $_.FullName "..\release\$($_.Name)" -Force
          }

          Get-ChildItem -Directory | Where-Object {
            $_.Name -notin @(
              "build",
              "__pycache__"
            )
          } | ForEach-Object {
            Get-ChildItem $_.FullName -File -Recurse | ForEach-Object {
              Copy-Item $_.FullName "..\release\$($_.Name)" -Force
            }
          }

      - name: Build Carrot-Launcher
        working-directory: "launcher d"
        shell: pwsh
        run: |
          if (Test-Path "build") {
            Remove-Item "build" -Recurse -Force
          }

          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name Carrot-Launcher `
            --distpath "..\release" `
            --workpath "build" `
            launcher.py

          Get-ChildItem -File | Where-Object {
            $_.Name -notin @(
              "launcher.py",
              "Carrot-Launcher.spec"
            )
          } | ForEach-Object {
            Copy-Item $_.FullName "..\release\$($_.Name)" -Force
          }

          Get-ChildItem -Directory | Where-Object {
            $_.Name -notin @(
              "build",
              "__pycache__"
            )
          } | ForEach-Object {
            Get-ChildItem $_.FullName -File -Recurse | ForEach-Object {
              Copy-Item $_.FullName "..\release\$($_.Name)" -Force
            }
          }

      - name: Remove empty and temporary files
        shell: pwsh
        run: |
          Get-ChildItem "release" -Recurse -Force | Where-Object {
            $_.PSIsContainer -or
            $_.Name -like "*.spec" -or
            $_.Name -like "*.py"
          } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

      - name: Verify release folder
        shell: pwsh
        run: |
          Write-Host "Final release contents:"
          Get-ChildItem "release" -Recurse | Select-Object FullName

          $directories = Get-ChildItem "release" -Directory -Recurse

          if ($directories.Count -gt 0) {
            Write-Error "Release folder contains subdirectories."
            exit 1
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: Carrot-Installer
          path: installer-output\Carrot-Installer.exe
