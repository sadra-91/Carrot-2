name: Build Carrot

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 requests keyboard openai Pillow pycairo svgwrite pyinstaller

      - name: Build PF-Carrot
        working-directory: app
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onedir `
            --windowed `
            --name PF-Carrot `
            main.py

      - name: Build C-Assistant
        working-directory: "assistant d"
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onedir `
            --windowed `
            --name C-Assistant `
            assistant.py

      - name: Build Carrot-Launcher
        working-directory: "launcher d"
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onedir `
            --windowed `
            --name Carrot-Launcher `
            launcher.py

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: Carrot-Installer
          path: installer-output\Carrot-Installer.exe
          if-no-files-found: error
